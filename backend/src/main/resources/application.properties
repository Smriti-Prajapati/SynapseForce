spring.application.name=synapseforce-api
server.port=${PORT:8081}

# Initialize datasource lazily so Tomcat starts (opens port) before DB connects
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.defer-datasource-initialization=true

# ── Database ──────────────────────────────────────────────────────────────────
# Local dev uses H2 in-memory. Production uses application-prod.properties.
spring.datasource.url=${DB_URL:jdbc:h2:mem:synapseforce;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:synapseforce-local-dev-secret-key-change-in-prod}
jwt.expiration=86400000

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
