# Production config — values injected via Render environment variables
# DATABASE_URL must be in JDBC format: jdbc:postgresql://host:5432/dbname
# If Supabase gives: postgresql://user:pass@host:5432/db
# Set it as:         jdbc:postgresql://host:5432/db?user=user&password=pass&sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool — important for Supabase free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File uploads
file.upload-dir=/tmp/uploads

# CORS
cors.allowed-origins=${FRONTEND_URL}

# Disable H2 console in prod
spring.h2.console.enabled=false
