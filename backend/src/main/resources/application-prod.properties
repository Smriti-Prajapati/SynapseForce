# Production — Supabase Session Pooler
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicitly set dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# This makes Hibernate use the dialect without needing a live connection at startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Disable H2 entirely
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Connection pool — allow startup even if DB not immediately reachable
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=0

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File uploads
file.upload-dir=/tmp/uploads

# CORS
cors.allowed-origins=${FRONTEND_URL}
