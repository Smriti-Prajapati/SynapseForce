# Production — Supabase PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/synapseforce}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 entirely
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Connection pool for Supabase free tier
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File uploads
file.upload-dir=/tmp/uploads

# CORS
cors.allowed-origins=${FRONTEND_URL}
